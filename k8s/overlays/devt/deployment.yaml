apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-jdbc-paramsource
spec:
  template:
    spec:
      containers:
        - name: quarkus-jdbc-paramsource
          env:
            - name: APP_AGENT_CONFIG_ID
              value: "agent1"
            - name: APP_AGENT_CONFIG_VERSION
              value: "1.0"
