apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
  name: quarkus-jdbc-paramsource-acpt
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k8s
    directory:
      include: '{kubernetes.yml,config-acpt.yml}'
    repoURL: https://github.com/rmortale/quarkus-jdbc-paramsource.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true