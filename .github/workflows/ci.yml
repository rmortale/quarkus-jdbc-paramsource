name: on push

on:
  push:
    paths-ignore:
      - "k8s/**"
      - "argocd/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -ntp -q --batch-mode clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: src/main/docker/Dockerfile.jvm
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: update tags in kustomize files
        run: |
          sed -i "s,newTag:.*,newTag:\ sha-${GITHUB_SHA::7}," k8s/overlays/devt/kustomization.yaml
          if [ $GITHUB_REF_NAME == 'main' ]; then
            sed -i "s,newTag:.*,newTag:\ sha-${GITHUB_SHA::7}," k8s/overlays/acpt/kustomization.yaml
          fi

      - uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
